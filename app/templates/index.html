<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rasp-desk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3e;
      --accent:  #7c6af7;
      --accent2: #5ee7df;
      --text:    #e2e4f0;
      --muted:   #8b8fa8;
      --ok:      #4caf7d;
      --err:     #f06464;
      --warn:    #f0a644;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--muted); margin-top: .4rem; font-size: .9rem; }

    /* ---- Status bar ---- */
    #status-bar {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .9rem 1.4rem;
      min-width: 130px;
      text-align: center;
    }
    .stat-card .label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .value { font-size: 1.4rem; font-weight: 700; margin-top: .2rem; }
    .stat-card .bar {
      height: 4px; border-radius: 2px;
      background: var(--border); margin-top: .5rem; overflow: hidden;
    }
    .stat-card .bar-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .6s ease;
    }

    /* ---- Actions grid ---- */
    h2 { font-size: 1rem; color: var(--muted); text-transform: uppercase;
         letter-spacing: .08em; margin-bottom: 1rem; text-align: center; }

    #actions {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
      max-width: 720px;
      margin: 0 auto 2.5rem;
    }

    .action-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.4rem 1rem;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s, transform .15s, box-shadow .2s;
      color: var(--text);
      font-size: .9rem;
      font-weight: 600;
    }
    .action-btn:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(124,106,247,.2);
    }
    .action-btn:active { transform: scale(.97); }
    .action-btn .icon { font-size: 2rem; display: block; margin-bottom: .5rem; }
    .action-btn.loading { opacity: .6; pointer-events: none; }

    /* ---- Output log ---- */
    #log-wrap { max-width: 720px; margin: 0 auto; }
    #log {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: .82rem;
      line-height: 1.6;
      min-height: 80px;
      max-height: 260px;
      overflow-y: auto;
      color: var(--accent2);
      white-space: pre-wrap;
    }
    #log .entry-ok   { color: var(--ok); }
    #log .entry-err  { color: var(--err); }
    #log .entry-info { color: var(--muted); }

    /* ---- Modal confirm ---- */
    #modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; z-index: 100;
    }
    #modal-bg.open { display: flex; }
    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      max-width: 360px; width: 90%;
      text-align: center;
    }
    #modal h3 { margin-bottom: .6rem; }
    #modal p  { color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; }
    .modal-btns { display: flex; gap: .8rem; justify-content: center; }
    .btn {
      padding: .6rem 1.4rem; border-radius: 8px; border: none;
      cursor: pointer; font-weight: 600; font-size: .9rem;
    }
    .btn-confirm { background: var(--accent); color: #fff; }
    .btn-cancel  { background: var(--border);  color: var(--text); }
  </style>
</head>
<body>

<header>
  <h1>rasp-desk</h1>
  <p>Raspberry Pi Zero 2 W · painel de controle</p>
</header>

<!-- Status -->
<div id="status-bar">
  <div class="stat-card">
    <div class="label">CPU</div>
    <div class="value" id="s-cpu">—</div>
    <div class="bar"><div class="bar-fill" id="b-cpu" style="width:0"></div></div>
  </div>
  <div class="stat-card">
    <div class="label">Memória</div>
    <div class="value" id="s-mem">—</div>
    <div class="bar"><div class="bar-fill" id="b-mem" style="width:0"></div></div>
  </div>
  <div class="stat-card">
    <div class="label">Disco</div>
    <div class="value" id="s-disk">—</div>
    <div class="bar"><div class="bar-fill" id="b-disk" style="width:0"></div></div>
  </div>
  <div class="stat-card">
    <div class="label">Temp.</div>
    <div class="value" id="s-temp">—</div>
  </div>
</div>

<!-- Ações -->
<h2>Ações</h2>
<div id="actions">
  {% for id, action in actions.items() %}
  <button class="action-btn"
          data-id="{{ id }}"
          data-label="{{ action.label }}"
          data-confirm="{{ 'true' if action.confirm else 'false' }}">
    <span class="icon">{{ action.icon }}</span>
    {{ action.label }}
  </button>
  {% endfor %}
</div>

<!-- Log -->
<div id="log-wrap">
  <h2>Saída</h2>
  <div id="log"><span class="entry-info">Aguardando ação...</span></div>
</div>

<!-- Modal -->
<div id="modal-bg">
  <div id="modal">
    <h3 id="modal-title">Confirmar</h3>
    <p id="modal-msg">Deseja executar esta ação?</p>
    <div class="modal-btns">
      <button class="btn btn-cancel"  id="btn-cancel">Cancelar</button>
      <button class="btn btn-confirm" id="btn-confirm">Confirmar</button>
    </div>
  </div>
</div>

<script>
  // ---- Status polling ----
  async function refreshStatus() {
    try {
      const d = await fetch('/api/status').then(r => r.json());
      document.getElementById('s-cpu').textContent  = d.cpu_percent + '%';
      document.getElementById('s-mem').textContent  = d.mem_percent + '%';
      document.getElementById('s-disk').textContent = d.disk_percent + '%';
      document.getElementById('s-temp').textContent = d.temp_c != null ? d.temp_c + '°C' : '—';
      document.getElementById('b-cpu').style.width  = d.cpu_percent  + '%';
      document.getElementById('b-mem').style.width  = d.mem_percent  + '%';
      document.getElementById('b-disk').style.width = d.disk_percent + '%';
    } catch(e) { /* Pi reiniciando */ }
  }
  refreshStatus();
  setInterval(refreshStatus, 4000);

  // ---- Log helper ----
  const logEl = document.getElementById('log');
  function appendLog(text, type = 'ok') {
    const ts = new Date().toLocaleTimeString('pt-BR');
    const span = document.createElement('span');
    span.className = 'entry-' + type;
    span.textContent = `[${ts}] ${text}\n`;
    logEl.textContent = '';
    logEl.appendChild(span);
  }

  // ---- Modal ----
  const modalBg    = document.getElementById('modal-bg');
  const modalTitle = document.getElementById('modal-title');
  const modalMsg   = document.getElementById('modal-msg');
  const btnConfirm = document.getElementById('btn-confirm');
  const btnCancel  = document.getElementById('btn-cancel');

  let pendingAction = null;

  function openModal(label, id) {
    modalTitle.textContent = label;
    modalMsg.textContent   = `Tem certeza que deseja executar: "${label}"?`;
    pendingAction = id;
    modalBg.classList.add('open');
  }

  btnCancel.addEventListener('click', () => {
    modalBg.classList.remove('open');
    pendingAction = null;
  });
  modalBg.addEventListener('click', e => {
    if (e.target === modalBg) btnCancel.click();
  });

  btnConfirm.addEventListener('click', () => {
    modalBg.classList.remove('open');
    if (pendingAction) executeAction(pendingAction);
    pendingAction = null;
  });

  // ---- Execute ----
  async function executeAction(id) {
    const btn = document.querySelector(`.action-btn[data-id="${id}"]`);
    if (btn) btn.classList.add('loading');
    appendLog(`Executando: ${id}...`, 'info');
    try {
      const res = await fetch(`/api/action/${id}`, { method: 'POST' });
      const data = await res.json();
      appendLog(data.output, data.ok ? 'ok' : 'err');
    } catch(e) {
      appendLog('Erro de comunicação com o Pi.', 'err');
    } finally {
      if (btn) btn.classList.remove('loading');
    }
  }

  // ---- Button click handler ----
  document.getElementById('actions').addEventListener('click', e => {
    const btn = e.target.closest('.action-btn');
    if (!btn) return;
    const id      = btn.dataset.id;
    const label   = btn.dataset.label;
    const confirm = btn.dataset.confirm === 'true';
    confirm ? openModal(label, id) : executeAction(id);
  });
</script>
</body>
</html>
